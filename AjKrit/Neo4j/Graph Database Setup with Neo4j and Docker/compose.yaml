services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j-lab
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser
      - "7687:7687" # Bolt
    environment:
      # Neo4j requires the initial Docker account to be named "neo4j".
      # NEO4J_USERNAME in .env is the lab user's login after it is created.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      # Use a separate read-only directory for source CSV files.
      NEO4J_server_directories_import: /import-data
    volumes:
      - neo4j_lab_data:/data
      - neo4j_lab_logs:/logs
      # Makes Results.csv available to Cypher as file:///Results.csv.
      - ../Import CSV data with Neo4j:/import-data:ro

volumes:
  neo4j_lab_data:
  neo4j_lab_logs:
