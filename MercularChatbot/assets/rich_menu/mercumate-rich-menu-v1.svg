<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2500" height="1686" viewBox="0 0 2500 1686">
  <title>MercuMate LINE Rich Menu v1</title>
  <image x="0" y="0" width="2500" height="1686"
         preserveAspectRatio="none"
         xlink:href="../source/rich-menu-background-v1.png"/>

  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .icon { fill: none; stroke: #39d9ff; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; filter: url(#glow); }
      .label { fill: #ffffff; font-family: 'Noto Sans Thai', sans-serif; font-size: 60px; font-weight: 700; text-anchor: middle; }
      .sub { fill: #7fe9ff; font-family: 'Noto Sans', sans-serif; font-size: 25px; font-weight: 700; letter-spacing: 2px; text-anchor: middle; }
      .pill { display: none; }
    </style>
  </defs>

  <!-- Search -->
  <g transform="translate(468 620)">
    <circle class="icon" cx="-20" cy="-18" r="52"/>
    <path class="icon" d="M18 20 L78 80"/>
  </g>
  <text class="label" x="468" y="770">ค้นหาสินค้า</text>
  <text class="sub" x="468" y="840">SMART SEARCH</text>

  <!-- Gaming -->
  <g transform="translate(1250 620)">
    <path class="icon" d="M-92 20 C-83 -46 -52 -66 0 -45 C52 -66 83 -46 92 20 L104 78 C108 101 82 112 66 94 L38 61 H-38 L-66 94 C-82 112 -108 101 -104 78 Z"/>
    <path class="icon" d="M-58 8 H-20 M-39 -11 V27"/>
    <circle cx="46" cy="-1" r="10" fill="#39d9ff"/>
    <circle cx="69" cy="22" r="10" fill="#39d9ff"/>
  </g>
  <text class="label" x="1250" y="770">เกมมิ่ง</text>
  <text class="sub" x="1250" y="840">GAMING GEAR</text>

  <!-- Audio -->
  <g transform="translate(2032 620)">
    <path class="icon" d="M-88 30 V-2 C-88 -62 -48 -99 0 -99 C48 -99 88 -62 88 -2 V30"/>
    <rect class="icon" x="-105" y="20" width="39" height="87" rx="18"/>
    <rect class="icon" x="66" y="20" width="39" height="87" rx="18"/>
  </g>
  <text class="label" x="2032" y="770">ออดิโอ</text>
  <text class="sub" x="2032" y="840">AUDIO</text>

  <!-- Gadget -->
  <g transform="translate(468 1180)">
    <rect class="icon" x="-92" y="-85" width="184" height="126" rx="12"/>
    <path class="icon" d="M-126 82 H126 L100 42 H-100 Z"/>
  </g>
  <text class="label" x="468" y="1330">แก็ดเจ็ต</text>
  <text class="sub" x="468" y="1400">IT &amp; TECH</text>

  <!-- Message Lab -->
  <g transform="translate(1250 1180)">
    <path class="icon" d="M-110 -87 H45 A25 25 0 0 1 70 -62 V24 A25 25 0 0 1 45 49 H-30 L-82 90 V49 H-110 A25 25 0 0 1 -135 24 V-62 A25 25 0 0 1 -110 -87 Z"/>
    <path class="icon" d="M-72 -20 H15 M-72 15 H37"/>
    <path class="icon" d="M80 -30 H110 A25 25 0 0 1 135 -5 V60 A25 25 0 0 1 110 85 H84 V118 L45 85 H15" opacity=".72"/>
  </g>
  <text class="label" x="1250" y="1330">เดโมข้อความ</text>
  <text class="sub" x="1250" y="1400">MESSAGE LAB</text>

  <!-- Help -->
  <g transform="translate(2032 1180)">
    <circle class="icon" cx="0" cy="0" r="105"/>
    <path class="icon" d="M-37 -32 C-34 -72 34 -79 43 -36 C50 -4 8 2 1 35"/>
    <circle cx="0" cy="75" r="12" fill="#39d9ff"/>
  </g>
  <text class="label" x="2032" y="1330">ช่วยเหลือ</text>
  <text class="sub" x="2032" y="1400">HELP</text>
</svg>
