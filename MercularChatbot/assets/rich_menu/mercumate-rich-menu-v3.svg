<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2500" height="1686" viewBox="0 0 2500 1686">
  <title>MercuMate LINE Rich Menu v3</title>
  <image x="0" y="0" width="2500" height="1686"
         preserveAspectRatio="none"
         xlink:href="../source/rich-menu-background-v1.png"/>

  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .icon { fill: none; stroke: #39d9ff; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; filter: url(#glow); }
      .label { fill: #ffffff; font-family: 'Noto Sans Thai', sans-serif; font-size: 60px; font-weight: 700; text-anchor: middle; }
      .sub { fill: #7fe9ff; font-family: 'Noto Sans', sans-serif; font-size: 25px; font-weight: 700; letter-spacing: 2px; text-anchor: middle; }
    </style>
  </defs>

  <!-- All products -->
  <g transform="translate(468 620)">
    <rect class="icon" x="-92" y="-92" width="72" height="72" rx="10"/>
    <rect class="icon" x="20" y="-92" width="72" height="72" rx="10"/>
    <rect class="icon" x="-92" y="20" width="72" height="72" rx="10"/>
    <rect class="icon" x="20" y="20" width="72" height="72" rx="10"/>
  </g>
  <text class="label" x="468" y="770">สินค้าทั้งหมด</text>
  <text class="sub" x="468" y="840">ALL PRODUCTS</text>

  <!-- Gaming -->
  <g transform="translate(1250 620)">
    <path class="icon" d="M-92 20 C-83 -46 -52 -66 0 -45 C52 -66 83 -46 92 20 L104 78 C108 101 82 112 66 94 L38 61 H-38 L-66 94 C-82 112 -108 101 -104 78 Z"/>
    <path class="icon" d="M-58 8 H-20 M-39 -11 V27"/>
    <circle cx="46" cy="-1" r="10" fill="#39d9ff"/>
    <circle cx="69" cy="22" r="10" fill="#39d9ff"/>
  </g>
  <text class="label" x="1250" y="770">เกมมิ่ง</text>
  <text class="sub" x="1250" y="840">GAMING</text>

  <!-- Computer -->
  <g transform="translate(2032 620)">
    <rect class="icon" x="-118" y="-86" width="236" height="142" rx="12"/>
    <path class="icon" d="M0 56 V96 M-58 96 H58"/>
    <circle cx="0" cy="34" r="8" fill="#39d9ff"/>
  </g>
  <text class="label" x="2032" y="770">คอมพิวเตอร์</text>
  <text class="sub" x="2032" y="840">COMPUTER</text>

  <!-- Smartphone and tablet -->
  <g transform="translate(468 1180)">
    <rect class="icon" x="-116" y="-88" width="142" height="176" rx="15"/>
    <rect class="icon" x="48" y="-72" width="84" height="160" rx="15"/>
    <path class="icon" d="M-70 62 H-20 M78 60 H102"/>
  </g>
  <text class="label" x="468" y="1330">มือถือ/แท็บเล็ต</text>
  <text class="sub" x="468" y="1400">SMARTPHONE / TABLET</text>

  <!-- Promotions -->
  <g transform="translate(1250 1180)">
    <path class="icon" d="M-115 -72 H115 V-26 C76 -21 76 21 115 26 V72 H-115 V26 C-76 21 -76 -21 -115 -26 Z"/>
    <circle class="icon" cx="-36" cy="-25" r="13"/>
    <circle class="icon" cx="36" cy="25" r="13"/>
    <path class="icon" d="M-43 45 L43 -45"/>
  </g>
  <text class="label" x="1250" y="1330">โปรโมชัน</text>
  <text class="sub" x="1250" y="1400">PROMOTIONS</text>

  <!-- Help -->
  <g transform="translate(2032 1180)">
    <circle class="icon" cx="0" cy="0" r="105"/>
    <path class="icon" d="M-37 -32 C-34 -72 34 -79 43 -36 C50 -4 8 2 1 35"/>
    <circle cx="0" cy="75" r="12" fill="#39d9ff"/>
  </g>
  <text class="label" x="2032" y="1330">ช่วยเหลือ</text>
  <text class="sub" x="2032" y="1400">HELP</text>
</svg>
